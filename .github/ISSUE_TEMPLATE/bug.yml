name: Bug report
description: Something in the bellatrix CLI or the scaffolded skills does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** report security vulnerabilities here — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: bellatrix version
      description: Output of `bellatrix --version`
      placeholder: '{"version":"3.1.3"}'
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - desktop (WinAppDriver)
        - web (Selenium / local browser driver)
        - mobile (Appium)
        - bellatrix init / scaffolded skills
        - help, trace or scripts
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: AI agent and language (if relevant)
      placeholder: e.g. Claude Code, --language csharp
  - type: textarea
    id: steps
    attributes:
      label: Commands you ran
      description: Each command and the JSON it printed. Remove anything private (paths, URLs, app names).
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, .NET 8.0.x, WinAppDriver 1.2.1 / Appium 2.x / Chrome 1xx
