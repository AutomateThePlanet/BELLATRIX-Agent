name: Release

# Pushing a tag `v<version>` (the <Version> in src/Bellatrix.Cli/Bellatrix.Cli.csproj) builds, tests and packs
# Bellatrix.Cli, pushes the package to NuGet.org with Trusted Publishing (no API key secret: NuGet/login exchanges
# this run's GitHub OIDC token for a short-lived key), and creates a GitHub release, marked Latest, with the .nupkg
# and its .sha256 file attached (the --add-source install in docs/INSTALL-PREVIEW.md uses them) and release notes made
# of the CHANGELOG.md section for that version plus GitHub's generated notes.
#
# nuget.org → Trusted Publishing policy: owner AutomateThePlanet, repository BELLATRIX-AI-Agents, workflow file
# release.yml, environment release. Steps: docs/contributing/RELEASE-CHECKLIST.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write   # gh release create
      id-token: write   # NuGet/login (Trusted Publishing)
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tag matches the package version
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $csproj = Get-Content src/Bellatrix.Cli/Bellatrix.Cli.csproj -Raw
          $packageVersion = [regex]::Match($csproj, '<Version>([^<]+)</Version>').Groups[1].Value
          if ($packageVersion -ne $version) { throw "Tag $env:TAG does not match the csproj version $packageVersion." }
          # RELEASE-CHECKLIST.md step 3: the changelog section is dated and no longer says "Not released yet".
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          if ($changelog -notmatch "(?m)^## \[$([regex]::Escape($version))\] - \d{4}-\d{2}-\d{2}\s*$") { throw "CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' heading." }
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[[^\]]+\]: )").Groups[1].Value
          if ($section -match 'Not released yet') { throw "CHANGELOG.md [$version] still says 'Not released yet'." }
          "VERSION=$version" >> $env:GITHUB_ENV

      # Every .bellatrix/config.json that `bellatrix init` writes has "$schema" pointing at the schema in this tag
      # (docs/contributing/RELEASE-CHECKLIST.md). Stop before anything is published if the tag does not serve it.
      - name: Config schema is served at this tag
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/AutomateThePlanet/BELLATRIX-AI-Agents/$env:TAG/schemas/bellatrix-config.v1.schema.json"
          $local = Get-Content schemas/bellatrix-config.v1.schema.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($local.'$id' -ne $url) { throw "schemas/bellatrix-config.v1.schema.json `$id is '$($local.'$id')', expected '$url'." }
          $remote = $null
          for ($i = 1; $i -le 10 -and -not $remote; $i++) {
            try { $remote = Invoke-RestMethod -Uri $url -ErrorAction Stop } catch { Start-Sleep -Seconds 15 }
          }
          if (-not $remote) { throw "$url is not reachable; is the tag $env:TAG pushed?" }
          if ($remote.'$id' -ne $url) { throw "$url serves a schema whose `$id is '$($remote.'$id')'." }

      - name: Restore
        run: dotnet restore BELLATRIX-Agent.sln

      - name: Build
        run: dotnet build BELLATRIX-Agent.sln --configuration Release --no-restore

      # The live E2E suite (tests/Bellatrix.Cli.E2E) needs real drivers and is not run here.
      - name: Unit tests
        run: dotnet test tests/Bellatrix.Cli.Tests --configuration Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results

      - name: README matrices are up to date
        shell: pwsh
        run: ./scripts/gen-readme-matrix.ps1 -Check

      - name: Pack
        shell: pwsh
        run: dotnet pack src/Bellatrix.Cli/Bellatrix.Cli.csproj --configuration Release --no-build --output artifacts/nuget "-p:Version=$env:VERSION" "-p:PackageVersion=$env:VERSION"

      - name: SHA-256 and release notes
        shell: pwsh
        run: |
          $name = "Bellatrix.Cli.$env:VERSION.nupkg"
          $package = "artifacts/nuget/$name"
          if (-not (Test-Path $package)) { throw "$package was not produced." }
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum format, so `sha256sum -c` works on the downloaded pair.
          [IO.File]::WriteAllText("$package.sha256", "$hash  $name`n")

          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[[^\]]+\]: )").Groups[1].Value.Trim()
          if (-not $section) { throw "CHANGELOG.md has no section for $env:VERSION." }
          $install = Get-Content docs/INSTALL-PREVIEW.md -Raw -Encoding utf8
          if (-not $install.Contains("--version $env:VERSION")) { throw "docs/INSTALL-PREVIEW.md does not describe $env:VERSION." }

          $notes = @(
            "## What's new in $env:VERSION", '', $section, '', '---', '', '## Install', '',
            '```bash', "dotnet tool install -g Bellatrix.Cli --version $env:VERSION   # or: dotnet tool update -g Bellatrix.Cli", '```', '',
            "From the attached ``$name`` instead (offline or pinned): [docs/INSTALL-PREVIEW.md](https://github.com/AutomateThePlanet/BELLATRIX-AI-Agents/blob/$env:TAG/docs/INSTALL-PREVIEW.md).", '',
            "**SHA-256** of ``$name``: ``$hash``", ''
          ) -join "`n"
          [IO.File]::WriteAllText("artifacts/release-notes.md", $notes)
          "PACKAGE=$package" >> $env:GITHUB_ENV

      # Trusted Publishing: exchanges the GitHub OIDC token for a NuGet API key that is valid for one hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: angelovstanton

      - name: Push to NuGet.org
        shell: pwsh
        run: dotnet nuget push $env:PACKAGE --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG $env:PACKAGE "$env:PACKAGE.sha256" --verify-tag --latest --title "Bellatrix.Cli $env:VERSION" --notes-file artifacts/release-notes.md --generate-notes
